# lwIP configuration of the virtwip package.
#
# LWIP_FLAGS collects -DNAME[=VALUE] entries. They are not passed to the
# compiler directly: Makefile.include turns them into the generated header
# virtwip_config.h, which include_shared/lwipopts.h includes on both the host
# and the VM side, so both always see the same lwIP configuration.

# LWIP_ARP requires both virtwip_arp and virtwip_ethernet
ifneq (,$(filter virtwip_arp,$(USEMODULE)))
  ifneq (,$(filter virtwip_ethernet,$(USEMODULE)))
    LWIP_FLAGS += -DLWIP_ARP=1
  else
    LWIP_FLAGS += -DLWIP_ARP=0
  endif
else
  LWIP_FLAGS += -DLWIP_ARP=0
endif

ifneq (,$(filter virtwip_autoip,$(USEMODULE)))
  LWIP_FLAGS += -DLWIP_AUTOIP=1
else
  LWIP_FLAGS += -DLWIP_AUTOIP=0
endif

ifneq (,$(filter virtwip_dhcp,$(USEMODULE)))
  LWIP_FLAGS += -DLWIP_DHCP=1
else
  LWIP_FLAGS += -DLWIP_DHCP=0
endif

ifneq (,$(filter virtwip_ethernet,$(USEMODULE)))
  LWIP_FLAGS += -DLWIP_ETHERNET=1
else
  LWIP_FLAGS += -DLWIP_ETHERNET=0
endif

ifneq (,$(filter virtwip_netif,$(USEMODULE)))
  LWIP_FLAGS += -DLWIP_NETIF_API=1
else
  LWIP_FLAGS += -DLWIP_NETIF_API=0
endif

ifneq (,$(filter virtwip_igmp,$(USEMODULE)))
  LWIP_FLAGS += -DLWIP_IGMP=1
else
  LWIP_FLAGS += -DLWIP_IGMP=0
endif

ifneq (,$(filter virtwip_ipv4,$(USEMODULE)))
  LWIP_FLAGS += -DLWIP_IPV4=1
else
  LWIP_FLAGS += -DLWIP_IPV4=0
endif

ifneq (,$(filter virtwip_ipv6_autoconfig,$(USEMODULE)))
  LWIP_FLAGS += -DLWIP_IPV6_AUTOCONFIG=1
else
  LWIP_FLAGS += -DLWIP_IPV6_AUTOCONFIG=0
endif

ifneq (,$(filter virtwip_ipv6_mld,$(USEMODULE)))
  LWIP_FLAGS += -DLWIP_IPV6_MLD=1
else
  LWIP_FLAGS += -DLWIP_IPV6_MLD=0
endif

ifneq (,$(filter virtwip_ipv6,$(USEMODULE)))
  LWIP_FLAGS += -DLWIP_IPV6=1
else
  LWIP_FLAGS += -DLWIP_IPV6=0
endif

ifneq (,$(filter virtwip_raw,$(USEMODULE)))
  LWIP_FLAGS += -DLWIP_RAW=1
else
  LWIP_FLAGS += -DLWIP_RAW=0
endif

ifneq (,$(filter virtwip_sixlowpan,$(USEMODULE)))
  LWIP_FLAGS += -DLWIP_6LOWPAN=1
else
  LWIP_FLAGS += -DLWIP_6LOWPAN=0
endif

ifneq (,$(filter virtwip_stats,$(USEMODULE)))
  LWIP_FLAGS += -DLWIP_STATS=1
else
  LWIP_FLAGS += -DLWIP_STATS=0
endif

ifneq (,$(filter virtwip_udp,$(USEMODULE)))
  LWIP_FLAGS += -DLWIP_UDP=1
else
  LWIP_FLAGS += -DLWIP_UDP=0
endif

ifneq (,$(filter virtwip_udplite,$(USEMODULE)))
  LWIP_FLAGS += -DLWIP_UDPLITE=1
else
  LWIP_FLAGS += -DLWIP_UDPLITE=0
endif

# Needed by the sock glue (netconn_set_recvtimeout()); it changes the layout
# of struct netconn, which the host glue accesses directly.
ifneq (,$(filter virtwip_sock_%,$(USEMODULE)))
  LWIP_FLAGS += -DLWIP_SO_RCVTIMEO=1
endif

# LWIP_NETCONN / LWIP_NETBUF_RECVINFO - nested IS_USED() logic
ifneq (,$(filter virtwip_sock,$(USEMODULE)))
  LWIP_FLAGS += -DLWIP_NETCONN=1
  ifneq (,$(filter sock_aux_local,$(USEMODULE)))
    LWIP_FLAGS += -DLWIP_NETBUF_RECVINFO=1
  endif
else
  LWIP_FLAGS += -DLWIP_NETCONN=0
endif

ifneq (,$(filter shell_cmd_lwip_netif,$(USEMODULE)))
  LWIP_FLAGS += -DLWIP_DEBUG=1
endif

# Unconditional defines
LWIP_FLAGS += -DLWIP_TCP=0
LWIP_FLAGS += -DLWIP_SOCKET=0
LWIP_FLAGS += -DLWIP_DONT_PROVIDE_BYTEORDER_FUNCTIONS
LWIP_FLAGS += -DMEMP_MEM_MALLOC=1
LWIP_FLAGS += -DNETIF_MAX_HWADDR_LEN=8

ifeq (,$(TCPIP_THREAD_STACKSIZE))
  LWIP_FLAGS += -DTCPIP_THREAD_STACKSIZE=9192
endif

LWIP_FLAGS += -DMEM_ALIGNMENT=4

# The VM always has 8-byte pointers
LWIP_FLAGS += -DIPV6_FRAG_COPYHEADER=1

# RIOT's MODULE_* defines are not available inside the VM build, so the SLIP
# netdev glue (host-side slip_output4/6, reached through the hybrid ICD
# dispatch) is announced through the shared config.
ifneq (,$(filter slipdev_net,$(USEMODULE)))
  LWIP_FLAGS += -DVIRTWIP_SLIPDEV=1
else
  LWIP_FLAGS += -DVIRTWIP_SLIPDEV=0
endif

# Optional host/VM layout check at VM startup (contrib/layout_check.c)
ifneq (,$(filter virtwip_layout_check,$(USEMODULE)))
  LWIP_FLAGS += -DVIRTWIP_LAYOUT_CHECK=1
else
  LWIP_FLAGS += -DVIRTWIP_LAYOUT_CHECK=0
endif

# lwIP slipif driver: disabled (needs an sio_* port that does not exist here;
# SLIP is handled by the netdev glue). Set to 1 AND re-include
# src/netif/slipif.c to use it.
LWIP_FLAGS += -DVIRTWIP_ENABLE_SLIPIF=0

ifeq (,$(MEM_SIZE))
  LWIP_FLAGS += -DMEM_SIZE='(TCPIP_THREAD_STACKSIZE+6144)'
endif
